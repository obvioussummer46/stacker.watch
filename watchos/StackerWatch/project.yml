# XcodeGen spec. Run `xcodegen generate` in this folder to produce StackerWatch.xcodeproj.
name: StackerWatch
options:
  bundleIdPrefix: news.stacker
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
packages:
  SNKit:
    path: ../SNKit
targets:
  StackerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: StackerWatch
    dependencies:
      - package: SNKit
    info:
      path: StackerWatch/Info.plist
      properties:
        CFBundleDisplayName: Stacker
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: news.stacker.watch
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: YOURTEAMID   # or pick a team in Xcode > Signing & Capabilities
